<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="img/culturama-favico.png" type="image/x-icon">
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <title>Pesquisa Culturama</title>
</head>
<body>
    <header>
        <img src="img/logo-culturama.png" alt="logo culturama">
    </header>

    <main class="conteudo">
        <!-- DADOS PESSOAIS -->
        <section class="area-formulario">

            <div class="titulo-e-form">
                
                <h1>Pesquisa Online</h1>
                <!-- Esse action serve pra por a url de destino desses dados -->
                <!-- get envia os dados pela url / post envia como header em uma requisição pro backend-->
                <form action="#" method="get">

                <div class="grupos">

                    <fieldset>

                        <legend>Dados Pessoais</legend>

                        <div class="campo">

                            <label for="id_name">Nome:</label>
                            <!-- type é o tipo de dado que vai receber / name é o nome do atributo -->
                            <input type="text" name="user_name" id="id_name" required>  <!-- required significa obrigatório -->
                        </div>

                        <div class="campo">
                            <label for="id_age">Idade</label>
                            <input type="number" name="user_age" min="12" max="100" id="id_age" required placeholder=" Entre 12-100 anos">
                        </div>

                        <div class="campo">
                            <label for="id_birth_date">Data de Nascimento</label>
                            <input type="date" name="user_birth_date" id="id_birth_date">
                        </div>

                        <div class="campo">
                            <label for="id_email">E-mail</label>
                            <input type="email" name="user_email" id="id_email" required>
                        </div>

                        <div class="campo">
                            <label for="id_cellphone">Telefone</label>
                            <input type="tel" name="user_cellphone" id="id_cellphone" pattern="[0-9]{11}" placeholder="DDD + número sem espaço ou hífen">
                        </div>

                        <div class="campo">
                            <label for="id_image">Foto</label>
                            <input type="file" accept="image/*" name="image" id="id_image">
                        </div>

                    </fieldset>

                    <fieldset>

                        <legend>Perfil</legend>

                        <div>
                            <p>Gênero</p>
                    
                            <div class="gender_group">

                                <input type="radio" name="user_gender" value="Masculino" id="id_male">
                                <label for="id_male">Masculino</label>

                                <input type="radio" name="user_gender" value="Feminino" id="id_female">
                                <label for="id_female">Feminino</label>

                                <input type="radio" name="user_gender" value="Prefiro não Informar" id="id_not_informed">
                                <label for="id_not_informed">Prefiro não Informar</label>

                            </div>

                        </div>

                        <div>
                            <label for="id_marital_status">Estado Civil</label>
                            <select name="marital_status" id="id_marital_status">
                                <option value="casado">Casado</option>
                                <option value="solteiro">Solteiro</option>
                                <option value="divorciado">Divorciado</option>
                                <option value="casado">União estável</option>
                            </select>
                        </div>

                        <div>
                            <label for="id_state">Estado</label>
                            <select name="user_state" id="id_state" required>
                                <option value="AC">Acre</option>
                                <option value="AL">Alagoas</option>
                                <option value="AP">Amapá</option>
                                <option value="AM">Amazonas</option>
                                <option value="BA">Bahia</option>
                                <option value="CE">Ceará</option>
                                <option value="DF">Distrito Federal</option>
                                <option value="ES">Espírito Santo</option>
                                <option value="GO">Goiás</option>
                                <option value="MA">Maranhão</option>
                                <option value="MT">Mato Grosso</option>
                                <option value="MS">Mato Grosso do Sul</option>
                                <option value="MG">Minas Gerais</option>
                                <option value="PA">Pará</option>
                                <option value="PB">Paraíba</option>
                                <option value="PR">Paraná</option>
                                <option value="PE">Pernambuco</option>
                                <option value="PI">Piauí</option>
                                <option value="RJ">Rio de Janeiro</option>
                                <option value="RN">Rio Grande do Norte</option>
                                <option value="RS">Rio Grande do Sul</option>
                                <option value="RO">Rondônia</option>
                                <option value="RR">Roraima</option>
                                <option value="SC">Santa Catarina</option>
                                <option value="SP">São Paulo</option>
                                <option value="SE">Sergipe</option>
                                <option value="TO">Tocantins</option>
                            </select>
                        </div>

                        <div>

                            <label for="id_city">Cidade</label>
                            <input type="text" name="user_city" id="id_city" placeholder="Ex.: Parobé" autocomplete="address-level2">

                        </div>

                    </fieldset>


                    <fieldset>
                        
                        <legend>Hábitos</legend>

                        <p>Redes Sociais:</p>

                        <div >
                            <input type="checkbox" name="social" value="instagram" id="id_instagram">
                            <label for="id_instagram">Instagram</label>
                        </div>

                         <div>
                            <input type="checkbox" name="social" value="facebook" id="id_facebook">
                            <label for="id_facebook">Facebook</label>
                        </div>

                        <div>
                            <input type="checkbox" name="social" value="tiktok" id="id_tiktok">
                            <label for="id_tiktok">TikTok</label>
                        </div>

                         <div>
                            <input type="checkbox" name="social" value="Linkedin" id="id_linkedin">
                            <label for="id_linkedin">Linkedin</label>
                        </div>

                        <div>
                            <input type="checkbox" name="social" value="Twiter" id="id_twiter">
                            <label for="id_twiter">Twiter</label>
                        </div>

                        <label for="id_musical_style">Estilo musical</label>
                        <input type="text" id="id_musical_style" list="id_list_musical_style" name="musical_style">
                        <datalist id="id_list_musical_style">
                            
                            <option value="samba">Samba</option>
                            <option value="pagode">Pagode</option>
                            <option value="blues">Blues</option>
                            <option value="jazz">Jazz</option>
                            <option value="mpb">MPB</option>
                            <option value="rock">Rock</option>
                            <option value="clássico">Clássico</option>
                            <option value="bossanova">Bossa-Nova</option>
                            <option value="pop">Pop</option>

                        </datalist>

                        <label for="id_favorite_color">Cor Favorita</label>

                        <input type="color" id="id_favorite_color" name="favorite_color" value="#FF0000">
                        

                    </fieldset>

                    <fieldset>

                        <legend>Opinião</legend>

                        <p>Escolha sua satisfação</p>

                        <div class="gender_group">
                            <input type="radio" name="satisfaction" id="id_perfect" value="perfect">
                            <label for="id_perfect">Ótimo</label>

                            <input type="radio" name="satisfaction" id="id_good" value="good">
                            <label for="id_good">Bom</label>

                            <input type="radio" name="satisfaction" id="id_regular" value="regular">
                            <label for="id_regular">Regular</label>

                            <input type="radio" name="satisfaction" id="id_bad" value="bad">
                            <label for="id_bad">Ruim</label>
                        </div>

                        <label for="id_comment">Seu Comentário:</label> 
                        <textarea name="comment" id="id_comment" rows="5" cols="40" placeholder="Digite seu comentário aqui..."></textarea>

                        <!-- 
                        row: Especifica o número de linhas visíveis da caixa de texto.
                        cols: Especifica a largura visível da caixa de texto (em caracteres).  
                        -->
                        
                    </fieldset>

                    <fieldset>
                        <legend>Confirmações</legend>

                        <div>
                            <input type="checkbox" name="user_lgpd" id="id_lgpd_term" value="accepted" required>
                            <label for="id_lgpd_term">Eu Aceito participar da pesquisa</label>
                        </div>

                        <div>
                            <input type="checkbox" name="user_get_result" id="id_get_result" value="accepted">
                            <label for="user_get_result">Desejo receber o resultado por E-mail</label>
                        </div>

                    </fieldset>

                </div>

                <!-- Precisa do button com o type pra dizer que vai submeter aquele dado -->
                <button type="submit">Enviar</button>
                <button type="reset">Limpar</button>

                

            </form>

        </section>
    </main>
</body>
</html>
