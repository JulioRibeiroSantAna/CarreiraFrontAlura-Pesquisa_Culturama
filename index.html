<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>Pesquisa Culturama</title>
</head>
<body>
    <header>

        <h1>Pesquisa Online</h1>

        <!-- DADOS PESSOAIS -->
        <section>
            <!-- Esse action serve pra por a url de destino desses dados -->
            <!-- get envia os dados pela url / post envia como header em uma requisição pro backend-->
            <form action="#" method="get">

                <div class="grupos">

                    <fieldset>

                        <legend>Dados Pessoais</legend>

                        <div class="campo">

                            <label for="user_name">Nome:</label>
                            <!-- type é o tipo de dado que vai receber / name é o nome do atributo -->
                            <input type="text" name="user_name" id="user_name" required>  <!-- required significa obrigatório -->
                        </div>

                        <div class="campo">
                            <label for="user_age">Idade</label>
                            <input type="number" name="user_age" min="12" max="100" id="user_age" required placeholder=" Entre 12-100 anos">
                        </div>

                        <div class="campo">
                            <label for="user_birth_date">Data de Nascimento</label>
                            <input type="date" name="user_birth_date" id="user_birth_date">
                        </div>

                        <div class="campo">
                            <label for="user_email">E-mail</label>
                            <input type="email" name="user_email" id="user_email" required>
                        </div>

                        <div class="campo">
                            <label for="user_cellphone">Telefone</label>
                            <input type="tel" name="user_cellphone" id="user_cellphone" pattern="[0-9]{11}" placeholder="DDD + número sem espaço ou hífen">
                        </div>

                        <div class="campo">
                            <label for="user_image">Foto</label>
                            <input type="file" accept="image/*" name="user_image" id="user_image">
                        </div>

                    </fieldset>

                    <fieldset>

                        <legend>Perfil</legend>

                        <div>
                            <p>Gênero</p>
                    
                            <div class="gender_group">

                                <input type="radio" name="user_gender" value="Masculino">
                                <label for="user_gender">Masculino</label>

                                <input type="radio" name="user_gender" value="Feminino">
                                <label for="user_gender">Feminino</label>

                                <input type="radio" name="user_gender" value="Prefiro não Informar">
                                <label for="user_gender">Prefiro não Informar</label>

                            </div>

                        </div>

                        <div>
                            <label for="marital_status">Estado Civil</label>
                            <select name="marital_status" id="marital_status">
                                <option value="casado">Casado</option>
                                <option value="solteiro">Solteiro</option>
                                <option value="divorciado">Divorciado</option>
                                <option value="casado">União estável</option>
                            </select>
                        </div>

                        <div>
                            <label for="user_state">Estado</label>
                            <select name="States" id="States" required>
                                <option value="AC">Acre</option>
                                <option value="AL">Alagoas</option>
                                <option value="AP">Amapá</option>
                                <option value="AM">Amazonas</option>
                                <option value="BA">Bahia</option>
                                <option value="CE">Ceará</option>
                                <option value="DF">Distrito Federal</option>
                                <option value="ES">Espírito Santo</option>
                                <option value="GO">Goiás</option>
                                <option value="MA">Maranhão</option>
                                <option value="MT">Mato Grosso</option>
                                <option value="MS">Mato Grosso do Sul</option>
                                <option value="MG">Minas Gerais</option>
                                <option value="PA">Pará</option>
                                <option value="PB">Paraíba</option>
                                <option value="PR">Paraná</option>
                                <option value="PE">Pernambuco</option>
                                <option value="PI">Piauí</option>
                                <option value="RJ">Rio de Janeiro</option>
                                <option value="RN">Rio Grande do Norte</option>
                                <option value="RS">Rio Grande do Sul</option>
                                <option value="RO">Rondônia</option>
                                <option value="RR">Roraima</option>
                                <option value="SC">Santa Catarina</option>
                                <option value="SP">São Paulo</option>
                                <option value="SE">Sergipe</option>
                                <option value="TO">Tocantins</option>
                            </select>
                        </div>

                        <div>

                            <label for="user_city">Cidade</label>
                            <input type="text" name="user_city" id="user_city" placeholder="Ex.: Parobé" autocomplete="address-level2">

                        </div>

                    </fieldset>


                    <fieldset>
                        
                        <legend>Hábitos</legend>

                        <p>Redes Sociais:</p>

                        <div >
                            <input type="checkbox" name="social" value="instagram">
                            <label for="social">Instagram</label>
                        </div>

                         <div>
                            <input type="checkbox" name="social" value="facebook">
                            <label for="social">Facebook</label>
                        </div>

                        <div>
                            <input type="checkbox" name="social" value="tiktok">
                            <label for="social">TikTok</label>
                        </div>

                         <div>
                            <input type="checkbox" name="social" value="Linkedin">
                            <label for="social">Linkedin</label>
                        </div>

                        <div>
                            <input type="checkbox" name="social" value="Twiter">
                            <label for="social">Twiter</label>
                        </div>
                        

                    </fieldset>

                </div>

                <!-- Precisa do button com o type pra dizer que vai submeter aquele dado -->
                <button type="submit">Enviar</button>

            </form>

        </section>
    </header>
</body>
</html>
